name: Build and Test

on:
  push:
    branches:
      - main
      - geo2geo
  pull_request:
    branches:
      - main
      - geo2geo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The contract asks for Linux, macOS and Windows (VAL-5, proposed, to be agreed with the Rigon group): the whole
  # suite runs on the three, with its tolerances. The bit-for-bit baselines (tools/golden_baseline.sh,
  # tools/snow_regression.sh) depend on the machine setup and are checked by hand on Linux.
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -U clean verify
