# Forcing of the fidelity run on Matsch_P2_Ref_007 (no canopy), written by
# org.geoframe.whetgeo1d.core.snowsoil.fidelity.GeotopForcingFiles from the
# GEOtop 3.0 input files in geotop/ (see README.md). Values from geotop.inpts.

meteoFile = geotop/meteo0001.txt
dateHeader = Date
# HeaderJulianDayfrom0Meteo: GEOtop dates the records with this column
julianDayHeader = JDfrom0
stationHorizonFile = geotop/horizon0001.txt
# no HorizonPointFile: GEOtop's point horizon is flat
pointHorizonFile =

latitude = 46.668
longitude = 10.579
# StandardTimeSimulation
standardTime = 1
elevation = 1549
slope = 21.4
aspect = 221.6
# no sky view factor given for the point: GEOtop uses 1
skyViewFactor = 1

# ThresTempRain, ThresTempSnow, RainCorrFactor, SnowCorrFactor
rainThreshold = 3
snowThreshold = -3.2
rainCorrection = 1.0
snowCorrection = 1.398
# LWinParameterization = 4
clearSkyEmissivity = IDSO_HODGES
# the meteo file has an empty CloudTrans column: GEOtop uses Kimball/Walcek
cloudAverage = KIMBALL

# 02/10/2009 00:00 - 02/11/2009 23:00 local standard time (UTC+1), TimeStepEnergyAndWater = 900
firstStepEnd = 2009-10-01 23:15
lastStepEnd = 2009-11-02 22:00
timeStep = 900
stationID = 1
outputFolder = data

# fallbacks from GEOtop's own output (no bare-soil energy balance, no evapotranspiration in the column)
geotopPointFile = geotop/output-tabs/point0001.txt
