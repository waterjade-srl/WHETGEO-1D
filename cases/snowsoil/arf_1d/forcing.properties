# Forcing of the ARF_1D snow regression, written by
# org.geoframe.whetgeo1d.core.snowsoil.fidelity.GeotopForcingFiles from the GEOtop 3.0 input files in geotop/
# (make_inputs.py). Values from tests/1D/ARF_1D/geotop.inpts of GEOtop 3.0 (commit 1f1fc5af).

meteoFile = geotop/meteo0001.txt
dateHeader = POSIX
# the JD column is not used: the dates of the records come from the POSIX column
julianDayHeader =
precipitationHeader = Iprec
windSpeedHeader = WindSp
relativeHumidityHeader = RH
airTemperatureHeader = AirT
shortwaveGlobalHeader = Swglob
stationHorizonFile = geotop/horizon0001.txt
pointHorizonFile =

latitude = 68.93
longitude = -150.27
# StandardTimeSimulation, MeteoStationStandardTime
standardTime = -9
elevation = 760
slope = 0
aspect = 0
skyViewFactor = 1

# ThresTempRain, ThresTempSnow, SnowCorrFactor (the last of the two values the official file gives), RainCorrFactor
rainThreshold = 3.66
snowThreshold = -0.06
rainCorrection = 1.0
snowCorrection = 0.54
# no LWinParameterization: GEOtop's default
clearSkyEmissivity = DILLEY_OBRIEN_1998

# 01/09/2001 01:00 - 15/06/2002 00:00 local standard time (UTC-9), hourly
firstStepEnd = 2001-09-01 10:00
lastStepEnd = 2002-06-15 09:00
timeStep = 3600
stationID = 1
outputFolder = data
